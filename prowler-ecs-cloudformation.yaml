  MCPTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentPrefix}-mcp'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '4096'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: mcp-server
          Image: !Sub 'prowlercloud/prowler-mcp:${MCPImageTag}'
          Essential: true
          Command: ['uvicorn', '--host', '0.0.0.0', '--port', '8000']
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
              Name: mcp
              AppProtocol: http
          Environment:
            - { Name: PROWLER_MCP_TRANSPORT_MODE, Value: http }
            - { Name: API_BASE_URL, Value: 'http://prowler-api.prowler:8080/api/v1' }
          HealthCheck:
            Command: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1']
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 15
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: mcp

  UITaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentPrefix}-ui'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '4096'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: ui
          Image: !Ref UIImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
              Name: ui
              AppProtocol: http
          Environment:
            - { Name: UI_API_BASE_URL, Value: 'http://prowler-api.prowler:8080/api/v1' }
            - { Name: AUTH_URL, Value: !Sub 'https://${DomainName}' }
            - { Name: AUTH_TRUST_HOST, Value: 'true' }
            - { Name: UI_API_DOCS_URL, Value: !Sub 'https://${DomainName}/api/v1/docs' }
            - { Name: PROWLER_MCP_SERVER_URL, Value: 'http://mcp-server.prowler:8000/mcp' }
            - { Name: NEXT_PUBLIC_PROWLER_RELEASE_VERSION, Value: v5.32.0 }
            - { Name: UI_PORT, Value: '3000' }
          Secrets:
            - Name: AUTH_SECRET
              ValueFrom: !Ref AuthSecretSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ui

  # ---------------------------------------------------------------------------
  # ECS Services
  # ---------------------------------------------------------------------------
  PostgresService:
    Type: AWS::ECS::Service
    DependsOn: [EFSMountTarget1, EFSMountTarget2]
    Properties:
      ServiceName: !Sub '${EnvironmentPrefix}-postgres'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref PostgresTaskDef
      DesiredCount: 1
      LaunchType: FARGATE
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref DataSecurityGroup]
          AssignPublicIp: ENABLED
      ServiceRegistries:
        - RegistryArn: !GetAtt PostgresDiscovery.Arn

  ValkeyService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${EnvironmentPrefix}-valkey'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ValkeyTaskDef
      DesiredCount: 1
      LaunchType: FARGATE
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref DataSecurityGroup]
          AssignPublicIp: ENABLED
      ServiceRegistries:
        - RegistryArn: !GetAtt ValkeyDiscovery.Arn

  Neo4jService:
    Type: AWS::ECS::Service
    DependsOn: [EFSMountTarget1, EFSMountTarget2]
    Properties:
      ServiceName: !Sub '${EnvironmentPrefix}-neo4j'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref Neo4jTaskDef
      DesiredCount: 1
      LaunchType: FARGATE
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref DataSecurityGroup]
          AssignPublicIp: ENABLED
      ServiceRegistries:
        - RegistryArn: !GetAtt Neo4jDiscovery.Arn

  APIService:
    Type: AWS::ECS::Service
    DependsOn: [PostgresService, ValkeyService, Neo4jService, APIListenerRule]
    Properties:
      ServiceName: !Sub '${EnvironmentPrefix}-api'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref APITaskDef
      DesiredCount: 0
      LaunchType: FARGATE
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 180
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref AppSecurityGroup]
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref APITargetGroup
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: prowler
        Services:
          - PortName: api
            DiscoveryName: prowler-api
            ClientAliases:
              - Port: 8080

  WorkerService:
    Type: AWS::ECS::Service
    DependsOn: [APIService]
    Properties:
      ServiceName: !Sub '${EnvironmentPrefix}-worker'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref WorkerTaskDef
      DesiredCount: 0
      LaunchType: FARGATE
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref AppSecurityGroup]
          AssignPublicIp: ENABLED
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: prowler

  WorkerBeatService:
    Type: AWS::ECS::Service
    DependsOn: [APIService]
    Properties:
      ServiceName: !Sub '${EnvironmentPrefix}-worker-beat'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref WorkerBeatTaskDef
      DesiredCount: 0
      LaunchType: FARGATE
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref AppSecurityGroup]
          AssignPublicIp: ENABLED
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: prowler

  MCPService:
    Type: AWS::ECS::Service
    DependsOn: [APIService]
    Properties:
      ServiceName: !Sub '${EnvironmentPrefix}-mcp'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref MCPTaskDef
      DesiredCount: 0
      LaunchType: FARGATE
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref AppSecurityGroup]
          AssignPublicIp: ENABLED
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: prowler
        Services:
          - PortName: mcp
            DiscoveryName: mcp-server
            ClientAliases:
              - Port: 8000

  UIService:
    Type: AWS::ECS::Service
    DependsOn: [APIService, MCPService, HTTPSListener]
    Properties:
      ServiceName: !Sub '${EnvironmentPrefix}-ui'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref UITaskDef
      DesiredCount: 0
      LaunchType: FARGATE
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref AppSecurityGroup]
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: ui
          ContainerPort: 3000
          TargetGroupArn: !Ref UITargetGroup
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: prowler

# =============================================================================
# OUTPUTS
# =============================================================================
Outputs:
  ALBDNSName:
    Description: ALB DNS name - point your domain CNAME/Alias to this value
    Value: !GetAtt ALB.DNSName

  ProwlerURL:
    Description: Prowler application URL (after DNS is configured)
    Value: !Sub 'https://${DomainName}'

  ECSClusterName:
    Description: ECS Cluster name for CLI operations
    Value: !Ref ECSCluster

  LogGroupName:
    Description: CloudWatch Log Group for all services
    Value: !Ref LogGroup

  PostDeploymentSteps:
    Description: Steps to complete after deployment
    Value: !Sub |
      1. Generate RSA keypair: openssl genrsa -out private.pem 2048 && openssl rsa -in private.pem -pubout -out public.pem
      2. Populate JWT secrets:
         aws secretsmanager put-secret-value --secret-id ${EnvironmentPrefix}/jwt-signing-key --secret-string file://private.pem
         aws secretsmanager put-secret-value --secret-id ${EnvironmentPrefix}/jwt-verifying-key --secret-string file://public.pem
      3. Point DNS: Create a CNAME or Route53 Alias for ${DomainName} -> ${ALB.DNSName}
      4. Scale up services:
         aws ecs update-service --cluster ${ECSCluster} --service ${EnvironmentPrefix}-api --desired-count 1
         aws ecs update-service --cluster ${ECSCluster} --service ${EnvironmentPrefix}-worker --desired-count 2
         aws ecs update-service --cluster ${ECSCluster} --service ${EnvironmentPrefix}-worker-beat --desired-count 1
         aws ecs update-service --cluster ${ECSCluster} --service ${EnvironmentPrefix}-mcp --desired-count 1
         aws ecs update-service --cluster ${ECSCluster} --service ${EnvironmentPrefix}-ui --desired-count 1
      5. Wait for services to stabilize (5-10 minutes)
      6. Navigate to https://${DomainName} and sign up (first user becomes tenant owner)
