AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Prowler ECS Fargate (Demo/POC). Deploys full stack: Postgres, Valkey, Neo4j,
  API, Worker, Worker-Beat, MCP, UI with ALB, EFS, Service Connect.
  Requires: ACM cert, domain, RSA key pair. All container images parameterized.
  All secrets stored in AWS Secrets Manager and injected via ECS Secrets at runtime.
  Not for production — use RDS, ElastiCache, multi-AZ, and hardened SGs in prod.

# =============================================================================
# METADATA - Console parameter grouping and labels
# =============================================================================
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Network Configuration"
        Parameters:
          - VpcId
          - SubnetIds
          - DomainName
          - ACMCertificateArn
          - AllowedCIDR
      - Label:
          default: "Container Images"
        Parameters:
          - UIImageUri
          - APIImageTag
          - MCPImageTag
          - PostgresImage
          - ValkeyImage
          - Neo4jImage
      - Label:
          default: "Database Credentials"
        Parameters:
          - PostgresPassword
          - Neo4jPassword
      - Label:
          default: "Application Security Keys"
        Parameters:
          - DjangoSecretsEncryptionKey
          - AuthSecret
      - Label:
          default: "Application Settings"
        Parameters:
          - DjangoAccessTokenLifetime
          - EnvironmentPrefix
      - Label:
          default: "Scan Target Configuration"
        Parameters:
          - ScanTargetAccountId
          - ScanTargetRoleName

    ParameterLabels:
      VpcId:
        default: "VPC ID"
      SubnetIds:
        default: "Subnet IDs (minimum 2, public subnets)"
      DomainName:
        default: "Domain Name (e.g., prowler.example.com)"
      ACMCertificateArn:
        default: "ACM Certificate ARN"
      AllowedCIDR:
        default: "Allowed CIDR for ALB access"
      UIImageUri:
        default: "Prowler UI Image URI"
      APIImageTag:
        default: "Prowler API Docker Hub tag"
      MCPImageTag:
        default: "Prowler MCP Docker Hub tag"
      PostgresImage:
        default: "PostgreSQL container image"
      ValkeyImage:
        default: "Valkey container image"
      Neo4jImage:
        default: "Neo4j/DozerDB container image"
      PostgresPassword:
        default: "PostgreSQL Password"
      Neo4jPassword:
        default: "Neo4j Password"
      DjangoSecretsEncryptionKey:
        default: "Django Secrets Encryption Key"
      AuthSecret:
        default: "Auth.js Session Secret"

      DjangoAccessTokenLifetime:
        default: "Access Token Lifetime (minutes)"
      EnvironmentPrefix:
        default: "Resource Name Prefix"
      ScanTargetAccountId:
        default: "Target AWS Account ID for scanning"
      ScanTargetRoleName:
        default: "Target IAM Role name to assume for scanning"

# =============================================================================
# PARAMETERS
# =============================================================================
Parameters:

  # --- Network Configuration ---
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      Select the VPC to deploy into. Must have internet access (public subnets with IGW).
      The default VPC works well for demos.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Select at least 2 public subnets in different AZs (required by ALB).
      These subnets must have auto-assign public IP enabled for Fargate tasks
      to pull images from Docker Hub and ECR.

  DomainName:
    Type: String
    Description: >
      The domain name for accessing Prowler (e.g., prowler.example.com).
      You must point this domain's DNS to the ALB after deployment.
      Used for AUTH_URL, CORS configuration, and SAML callbacks.
    AllowedPattern: '^[a-zA-Z0-9]([a-zA-Z0-9\-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9\-]*[a-zA-Z0-9])?)*$'
    ConstraintDescription: Must be a valid domain name.

  ACMCertificateArn:
    Type: String
    Description: >
      ARN of an ACM certificate validated for the domain above.
      Example: arn:aws:acm:us-east-1:123456789012:certificate/abc-123
      The certificate must be in the same region as this stack.
    AllowedPattern: '^arn:aws:acm:[a-z0-9-]+:\d{12}:certificate\/[a-f0-9-]+$'
    ConstraintDescription: Must be a valid ACM certificate ARN.

  AllowedCIDR:
    Type: String
    Default: '0.0.0.0/0'
    Description: >
      CIDR range allowed to access the ALB (HTTPS).
      For security, restrict to your IP (e.g., 203.0.113.1/32).
      Use 0.0.0.0/0 only if you want public access.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  # --- Container Images ---
  UIImageUri:
    Type: String
    Default: 'prowlercloud/prowler-ui:stable'
    Description: >
      Prowler UI container image. Defaults to the published Docker Hub image.
      Override with a custom ECR URI if you need to pin a specific build or
      version string (e.g., 123456789012.dkr.ecr.us-east-1.amazonaws.com/prowler-ui:v5.32.0).

  APIImageTag:
    Type: String
    Default: 'stable'
    Description: >
      Docker Hub tag for prowlercloud/prowler-api image.
      Use 'stable' for the latest release or a specific version tag.

  MCPImageTag:
    Type: String
    Default: 'stable'
    Description: >
      Docker Hub tag for prowlercloud/prowler-mcp image.
      Use 'stable' for the latest release.

  PostgresImage:
    Type: String
    Default: 'postgres:16.3-alpine3.20'
    Description: >
      PostgreSQL container image. Pin to a specific version to avoid unexpected
      upgrades. Major version changes (e.g., 16 to 17) require data migration.
      Only change this during planned maintenance with a database backup.

  ValkeyImage:
    Type: String
    Default: 'valkey/valkey:7-alpine3.19'
    Description: >
      Valkey (Redis-compatible) container image. Minor version bumps within
      the same major version are generally safe. Major version upgrades may
      change persistence format or protocol behavior.

  Neo4jImage:
    Type: String
    Default: 'graphstack/dozerdb:5.26.3.0'
    Description: >
      Neo4j/DozerDB container image for Attack Paths graph database.
      Version changes may require store migration. Test upgrades in a
      non-production environment first. Back up /data EFS volume before upgrading.

  # --- Database Credentials ---
  PostgresPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 64
    AllowedPattern: '^[a-zA-Z0-9!@#%^&*()\-_=+.]{8,64}$'
    ConstraintDescription: >
      8-64 characters. Alphanumeric and !@#%^&*()-_=+. only.
      Avoid / (breaks Neo4j auth), $ (interpreted by shell/CloudFormation), " and \ (break JSON).
    Description: >
      Password for the PostgreSQL database. Use alphanumeric characters and safe
      special characters (!@#%^&*()-_=+.). Avoid / $ " \ and backticks.
      Generate with: openssl rand -base64 16
      Will be stored in AWS Secrets Manager by this template.

  Neo4jPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 64
    AllowedPattern: '^[a-zA-Z0-9!@#%^&*()\-_=+.]{8,64}$'
    ConstraintDescription: >
      8-64 characters. Alphanumeric and !@#%^&*()-_=+. only.
      The / character is NOT allowed because Neo4j uses neo4j/<password> format.
    Description: >
      Password for the Neo4j graph database (used for Attack Paths).
      IMPORTANT: Do not use / in this password — Neo4j auth format is neo4j/<password>
      and a / in the password breaks the delimiter. Generate with: openssl rand -base64 16
      Will be stored in AWS Secrets Manager by this template.

  # --- Application Security Keys ---
  DjangoSecretsEncryptionKey:
    Type: String
    NoEcho: true
    MinLength: 40
    MaxLength: 50
    Description: >
      Encryption key for Django secrets storage (encrypts provider credentials in DB).
      Must be exactly 32 bytes, base64-encoded (44 characters with padding).
      Generate with: openssl rand -base64 32
      If lost, all stored provider credentials become unreadable.
      Will be stored in AWS Secrets Manager by this template.

  AuthSecret:
    Type: String
    NoEcho: true
    MinLength: 40
    MaxLength: 50
    Description: >
      Secret for Auth.js session encryption in the UI (encrypts browser session cookies).
      Must be exactly 32 bytes, base64-encoded (44 characters with padding).
      Generate with: openssl rand -base64 32
      Changing this value invalidates all active browser sessions.
      Will be stored in AWS Secrets Manager by this template.



  # --- Application Settings ---
  DjangoAccessTokenLifetime:
    Type: Number
    Default: 180
    MinValue: 30
    MaxValue: 1440
    Description: >
      JWT access token lifetime in minutes. Set to 180 (3 hours) for demos
      to avoid token expiry during long scan pipelines. Default 30 is too short
      for Fargate deployments where scans + integrations can take 60+ minutes.

  EnvironmentPrefix:
    Type: String
    Default: 'prowler'
    MaxLength: 20
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: >
      Prefix for all resource names (e.g., prowler, mycompany-prowler).
      Lowercase letters, numbers, and hyphens only. Starts with a letter.

  # --- Scan Target Configuration ---
  ScanTargetAccountId:
    Type: String
    Default: '*'
    Description: >
      AWS account ID that Prowler will scan (the account where the ProwlerScan role lives).
      Use '*' to allow scanning any account, or enter a specific 12-digit account ID to
      restrict. Can be updated via CloudFormation change set after initial deployment.
    AllowedPattern: '^(\*|\d{12})$'
    ConstraintDescription: Must be a 12-digit AWS account ID or '*' for any account.

  ScanTargetRoleName:
    Type: String
    Default: 'ProwlerScan'
    Description: >
      Name of the IAM role in the target account that Prowler will assume to perform scans.
      This role must exist in the target account with SecurityAudit + ViewOnlyAccess policies
      and a trust policy allowing the ECS task role to assume it.
    AllowedPattern: '^[a-zA-Z0-9+=,.@\-_]{1,64}$'
    ConstraintDescription: Must be a valid IAM role name (1-64 chars, alphanumeric and +=,.@-_).

# =============================================================================
# RESOURCES
# =============================================================================
Resources:

  # ---------------------------------------------------------------------------
  # Security Groups
  # ---------------------------------------------------------------------------
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${EnvironmentPrefix} - ALB inbound HTTPS'
      GroupName: !Sub '${EnvironmentPrefix}-alb-sg'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedCIDR
          Description: HTTPS from allowed CIDR
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCIDR
          Description: HTTP redirect to HTTPS

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${EnvironmentPrefix} - App containers'
      GroupName: !Sub '${EnvironmentPrefix}-app-sg'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: API from ALB
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: UI from ALB
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: MCP from ALB

  AppSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      SourceSecurityGroupId: !Ref AppSecurityGroup
      Description: All TCP from self (inter-container)

  DataSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${EnvironmentPrefix} - Data stores'
      GroupName: !Sub '${EnvironmentPrefix}-data-sg'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Postgres from app
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Valkey from app
        - IpProtocol: tcp
          FromPort: 7687
          ToPort: 7687
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Neo4j Bolt from app
        - IpProtocol: tcp
          FromPort: 7474
          ToPort: 7474
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Neo4j HTTP from app

  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${EnvironmentPrefix} - EFS mount targets'
      GroupName: !Sub '${EnvironmentPrefix}-efs-sg'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref DataSecurityGroup
          Description: NFS from data containers
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: NFS from app containers (shared output volume)

  # ---------------------------------------------------------------------------
  # EFS File System and Access Points
  # ---------------------------------------------------------------------------
  EFSFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      FileSystemTags:
        - Key: Name
          Value: !Sub '${EnvironmentPrefix}-data'

  EFSMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId: !Select [0, !Ref SubnetIds]
      SecurityGroups: [!Ref EFSSecurityGroup]

  EFSMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId: !Select [1, !Ref SubnetIds]
      SecurityGroups: [!Ref EFSSecurityGroup]

  PostgresAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref EFSFileSystem
      PosixUser:
        Uid: '70'
        Gid: '70'
      RootDirectory:
        Path: /postgres-data
        CreationInfo:
          OwnerUid: '70'
          OwnerGid: '70'
          Permissions: '0755'
      AccessPointTags:
        - Key: Name
          Value: !Sub '${EnvironmentPrefix}-postgres'

  Neo4jAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref EFSFileSystem
      PosixUser:
        Uid: '7474'
        Gid: '7474'
      RootDirectory:
        Path: /neo4j-data
        CreationInfo:
          OwnerUid: '7474'
          OwnerGid: '7474'
          Permissions: '0755'
      AccessPointTags:
        - Key: Name
          Value: !Sub '${EnvironmentPrefix}-neo4j'

  OutputAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref EFSFileSystem
      PosixUser:
        Uid: '1000'
        Gid: '1000'
      RootDirectory:
        Path: /prowler-output
        CreationInfo:
          OwnerUid: '1000'
          OwnerGid: '1000'
          Permissions: '0755'
      AccessPointTags:
        - Key: Name
          Value: !Sub '${EnvironmentPrefix}-output'

  # ---------------------------------------------------------------------------
  # CloudWatch Log Group
  # ---------------------------------------------------------------------------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentPrefix}'
      RetentionInDays: 7

  # ---------------------------------------------------------------------------
  # IAM Roles
  # ---------------------------------------------------------------------------
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentPrefix}-task-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref JWTSigningKeySecret
                  - !Ref JWTVerifyingKeySecret
                  - !Ref DjangoSecretsKeySecret
                  - !Ref PostgresPasswordSecret
                  - !Ref Neo4jPasswordSecret
                  - !Ref Neo4jAuthSecret
                  - !Ref AuthSecretSecret

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentPrefix}-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ECSExecPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'
        - PolicyName: ProwlerScanAssumeRole
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: !Sub 'arn:aws:iam::${ScanTargetAccountId}:role/${ScanTargetRoleName}'

  # ---------------------------------------------------------------------------
  # Secrets Manager
  # ---------------------------------------------------------------------------
  JWTSigningKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentPrefix}/jwt-signing-key'
      Description: >-
        RSA private key for JWT signing. MUST be populated with actual PEM content
        after stack creation. Use: aws secretsmanager put-secret-value
        --secret-id <prefix>/jwt-signing-key --secret-string file://private.pem
      SecretString: 'REPLACE_ME_WITH_RSA_PRIVATE_KEY'

  JWTVerifyingKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentPrefix}/jwt-verifying-key'
      Description: >-
        RSA public key for JWT verification. MUST be populated with actual PEM content
        after stack creation. Use: aws secretsmanager put-secret-value
        --secret-id <prefix>/jwt-verifying-key --secret-string file://public.pem
      SecretString: 'REPLACE_ME_WITH_RSA_PUBLIC_KEY'

  DjangoSecretsKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentPrefix}/django-secrets-key'
      Description: Django secrets encryption key
      SecretString: !Ref DjangoSecretsEncryptionKey

  PostgresPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentPrefix}/postgres-password'
      Description: PostgreSQL database password
      SecretString: !Ref PostgresPassword

  Neo4jPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentPrefix}/neo4j-password'
      Description: Neo4j database password
      SecretString: !Ref Neo4jPassword

  Neo4jAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentPrefix}/neo4j-auth'
      Description: Neo4j auth string (neo4j/<password>)
      SecretString: !Sub 'neo4j/${Neo4jPassword}'

  AuthSecretSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentPrefix}/auth-secret'
      Description: Auth.js session encryption secret
      SecretString: !Ref AuthSecret

  # ---------------------------------------------------------------------------
  # ECS Cluster with Cloud Map Namespace
  # ---------------------------------------------------------------------------
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentPrefix}'
      ServiceConnectDefaults:
        Namespace: !GetAtt CloudMapNamespace.Arn

  CloudMapNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: prowler
      Vpc: !Ref VpcId
      Description: Prowler service discovery namespace


  # ---------------------------------------------------------------------------
  # Application Load Balancer
  # ---------------------------------------------------------------------------
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentPrefix}-alb'
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref ALBSecurityGroup]

  APITargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentPrefix}-api-tg'
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /api/v1/docs
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  UITargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentPrefix}-ui-tg'
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200,302,307'

  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref ACMCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref UITargetGroup

  HTTPRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  APIListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HTTPSListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          Values: ['/api/v1/*']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref APITargetGroup

  # ---------------------------------------------------------------------------
  # Cloud Map Services (for data layer - no Service Connect proxy)
  # ---------------------------------------------------------------------------
  PostgresDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: postgres
      NamespaceId: !GetAtt CloudMapNamespace.Id
      DnsConfig:
        DnsRecords:
          - Type: A
            TTL: 10

  ValkeyDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: valkey
      NamespaceId: !GetAtt CloudMapNamespace.Id
      DnsConfig:
        DnsRecords:
          - Type: A
            TTL: 10

  Neo4jDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: neo4j
      NamespaceId: !GetAtt CloudMapNamespace.Id
      DnsConfig:
        DnsRecords:
          - Type: A
            TTL: 10

  # ---------------------------------------------------------------------------
  # Task Definitions
  # ---------------------------------------------------------------------------
  PostgresTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentPrefix}-postgres'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '4096'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: postgres-data
          EFSVolumeConfiguration:
            FilesystemId: !Ref EFSFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref PostgresAccessPoint
              IAM: DISABLED
      ContainerDefinitions:
        - Name: postgres
          Image: !Ref PostgresImage
          Essential: true
          PortMappings:
            - ContainerPort: 5432
              Protocol: tcp
              Name: postgres
          MountPoints:
            - SourceVolume: postgres-data
              ContainerPath: /var/lib/postgresql/data
          Environment:
            - Name: POSTGRES_USER
              Value: prowler_admin
            - Name: POSTGRES_DB
              Value: prowler_db
          Secrets:
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Ref PostgresPasswordSecret
          HealthCheck:
            Command: ['CMD-SHELL', 'pg_isready -U prowler_admin -d prowler_db']
            Interval: 10
            Timeout: 5
            Retries: 5
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: postgres

  ValkeyTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentPrefix}-valkey'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '4096'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: valkey
          Image: !Ref ValkeyImage
          Essential: true
          PortMappings:
            - ContainerPort: 6379
              Protocol: tcp
              Name: valkey
          HealthCheck:
            Command: ['CMD-SHELL', 'valkey-cli ping']
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 10
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: valkey

  Neo4jTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentPrefix}-neo4j'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '4096'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: neo4j-data
          EFSVolumeConfiguration:
            FilesystemId: !Ref EFSFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref Neo4jAccessPoint
              IAM: DISABLED
      ContainerDefinitions:
        - Name: neo4j
          Image: !Ref Neo4jImage
          Essential: true
          PortMappings:
            - ContainerPort: 7687
              Protocol: tcp
              Name: neo4j-bolt
            - ContainerPort: 7474
              Protocol: tcp
              Name: neo4j-http
              AppProtocol: http
          MountPoints:
            - SourceVolume: neo4j-data
              ContainerPath: /data
          Environment:
            - Name: NEO4J_dbms_max__databases
              Value: '1000'
            - Name: NEO4J_server_memory_pagecache_size
              Value: '512M'
            - Name: NEO4J_server_memory_heap_initial__size
              Value: '512M'
            - Name: NEO4J_server_memory_heap_max__size
              Value: '512M'
            - Name: NEO4J_PLUGINS
              Value: '["apoc"]'
            - Name: NEO4J_dbms_security_procedures_allowlist
              Value: 'apoc.*'
            - Name: dbms.connector.bolt.listen_address
              Value: '0.0.0.0:7687'
          Secrets:
            - Name: NEO4J_AUTH
              ValueFrom: !Ref Neo4jAuthSecret
          HealthCheck:
            Command: ['CMD-SHELL', 'wget --no-verbose -O /dev/null http://localhost:7474 || exit 1']
            Interval: 30
            Timeout: 10
            Retries: 10
            StartPeriod: 120
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: neo4j

  APITaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentPrefix}-api'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '4096'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: prowler-output
          EFSVolumeConfiguration:
            FilesystemId: !Ref EFSFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref OutputAccessPoint
              IAM: DISABLED
      ContainerDefinitions:
        - Name: api
          Image: !Sub 'prowlercloud/prowler-api:${APIImageTag}'
          Essential: true
          EntryPoint: ['/home/prowler/docker-entrypoint.sh', 'prod']
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
              Name: api
              AppProtocol: http
          MountPoints:
            - SourceVolume: prowler-output
              ContainerPath: /tmp/prowler_api_output
          Environment:
            - { Name: DJANGO_SETTINGS_MODULE, Value: config.django.production }
            - { Name: DJANGO_ALLOWED_HOSTS, Value: '*' }
            - { Name: DJANGO_BIND_ADDRESS, Value: '0.0.0.0' }
            - { Name: DJANGO_PORT, Value: '8080' }
            - { Name: DJANGO_DEBUG, Value: 'False' }
            - { Name: DJANGO_LOGGING_FORMATTER, Value: human_readable }
            - { Name: DJANGO_LOGGING_LEVEL, Value: INFO }
            - { Name: DJANGO_WORKERS, Value: '2' }
            - { Name: DJANGO_MANAGE_DB_PARTITIONS, Value: 'True' }
            - { Name: DJANGO_ACCESS_TOKEN_LIFETIME, Value: !Sub '${DjangoAccessTokenLifetime}' }
            - { Name: DJANGO_REFRESH_TOKEN_LIFETIME, Value: '1440' }
            - { Name: DJANGO_CACHE_MAX_AGE, Value: '3600' }
            - { Name: DJANGO_STALE_WHILE_REVALIDATE, Value: '60' }
            - { Name: DJANGO_BROKER_VISIBILITY_TIMEOUT, Value: '86400' }
            - { Name: DJANGO_THROTTLE_TOKEN_OBTAIN, Value: '50/minute' }
            - { Name: DJANGO_CORS_ALLOWED_ORIGINS, Value: !Sub 'https://${DomainName}' }
            - { Name: SAML_SSO_CALLBACK_URL, Value: !Sub 'https://${DomainName}/api/auth/callback/saml' }
            - { Name: POSTGRES_HOST, Value: postgres.prowler }
            - { Name: POSTGRES_PORT, Value: '5432' }
            - { Name: POSTGRES_ADMIN_USER, Value: prowler_admin }
            - { Name: POSTGRES_USER, Value: prowler_admin }
            - { Name: POSTGRES_DB, Value: prowler_db }
            - { Name: VALKEY_HOST, Value: valkey.prowler }
            - { Name: VALKEY_PORT, Value: '6379' }
            - { Name: VALKEY_DB, Value: '0' }
            - { Name: NEO4J_HOST, Value: neo4j.prowler }
            - { Name: NEO4J_PORT, Value: '7687' }
            - { Name: NEO4J_USER, Value: neo4j }
          Secrets:
            - Name: DJANGO_SECRETS_ENCRYPTION_KEY
              ValueFrom: !Ref DjangoSecretsKeySecret
            - Name: DJANGO_TOKEN_SIGNING_KEY
              ValueFrom: !Ref JWTSigningKeySecret
            - Name: DJANGO_TOKEN_VERIFYING_KEY
              ValueFrom: !Ref JWTVerifyingKeySecret
            - Name: POSTGRES_ADMIN_PASSWORD
              ValueFrom: !Ref PostgresPasswordSecret
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Ref PostgresPasswordSecret
            - Name: NEO4J_PASSWORD
              ValueFrom: !Ref Neo4jPasswordSecret
          HealthCheck:
            Command: ['CMD-SHELL', 'wget --no-verbose --spider http://localhost:8080/api/v1/docs || exit 1']
            Interval: 15
            Timeout: 5
            Retries: 5
            StartPeriod: 120
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

